<script>
// Scène: m=toi [x,y,versX,versY], u=coéquipiers, o=adversaires, b=ballon. Terrain 100x64, on attaque vers la droite.
const Q={
G:{n:"Gardien (GB)",l:[
{c:"Contre-attaque",q:"Tu captes un centre. Ton équipe peut partir vite. Que fais-tu ?",s:{m:[5,32],u:[[40,12,75,10],[40,52,70,50],[30,32,60,32]],o:[[60,28],[62,42],[50,20,40,26]],b:[5,32,75,10]},k:[["vite","rapide","immediat","direct"],["relance","lance","main","pied","passe","donne"],["ailier","attaquant","espace","profondeur","course"]],a:"Relancer immédiatement à la main ou au pied vers un coéquipier lancé dans l’espace.",t:"Lève la tête AVANT d’attraper le ballon : repère qui court derrière la défense. Les 3 premières secondes après une récupération sont les plus dangereuses."},
{c:"Défensif",q:"Un attaquant arrive seul face à toi. Quelle est ta réaction ?",s:{m:[5,32,12,32],u:[[15,15],[15,49]],o:[[28,32,16,32],[45,20]],b:[26,32,15,32]},k:[["avanc","sors","sortir","reduire","angle"],["grand","large","taille","bloque","ferme"],["attend","reste","debout","patient","pas plonger"]],a:"Sortir pour réduire l’angle, se faire grand et rester debout le plus longtemps possible.",t:"Avance quand le ballon est loin du pied, arrête-toi quand il le touche. Ne plonge jamais le premier."},
{c:"Sans ballon",q:"Le ballon est sur l’aile adverse. Où te places-tu et que surveilles-tu ?",s:{m:[5,32,18,32],u:[[28,20],[28,44],[35,32]],o:[[45,10,55,14],[60,25]],b:[44,10,58,16]},k:[["avanc","haut","ligne","derriere la defense"],["profondeur","dos","balle en profondeur","passe longue"],["communique","parle","crie","defenseur","organise"]],a:"Monter derrière la défense, surveiller les longs ballons derrière elle et guider tes défenseurs en parlant fort.",t:"Ton rôle sans ballon : être le 11e joueur de champ. Plus tu joues haut sur le terrain, moins l’équipe a d’espace à défendre."},
{c:"Offensif",q:"L’adversaire presse haut et tu as le ballon. Quelle option ?",s:{m:[5,32],u:[[15,12],[15,52],[25,32,28,32]],o:[[22,30,10,32],[30,14],[30,50]],b:[7,32,15,12]},k:[["passe","relance","jou"],["libre","espace","demarqu","sans pression"],["calme","temps","controle","regard","scan","vision","tete"]],a:"Garder son calme, regarder autour de toi puis jouer vers le coéquipier libre (côté) ou long vers l’avant.",t:"Regarde l’attaquant qui te met la pression : s’il se rapproche de toi, un coéquipier est sûrement libre derrière lui."}]},
D:{n:"Défenseur central (DC)",l:[
{c:"Défensif",q:"Ton partenaire central est battu et l’attaquant file. Que fais-tu ?",s:{m:[30,36,18,32],u:[[28,22,18,26],[32,50]],o:[[40,28,22,30],[45,45]],b:[38,28,20,30]},k:[["couvr","couverture","soutien","aide","compens"],["ferme","angle","axe","but"],["communic","parl","crie"]],a:"Aller aider ton partenaire en restant derrière lui, fermer le passage devant le but et lui parler.",t:"Dès que ton partenaire est dépassé, tu deviens le dernier défenseur : cours vers le but, pas vers le ballon."},
{c:"Contre-attaque",q:"L’adversaire contre-attaque à 3 contre 2. Que fais-tu ?",s:{m:[30,32,22,32],u:[[32,16,24,20],[32,48,24,44]],o:[[50,22,34,26],[50,34,34,34],[50,46,34,42]],b:[50,34,34,34]},k:[["recul","repli","ralenti","retard","temporis"],["pas plonger","pas tacler","patien","attend","reste"],["coequip","retour","partenaire","temps"]],a:"Reculer, gagner du temps sans te jeter au sol pour laisser revenir tes coéquipiers.",t:"Ton rôle n’est pas de récupérer le ballon mais de gagner du temps. Envoie le joueur qui a le ballon vers l’extérieur."},
{c:"Sans ballon",q:"Le ballon est de l’autre côté du terrain. Où te placer ?",s:{m:[40,32,36,26],u:[[40,12],[40,50],[42,38]],o:[[60,52,60,50],[55,40],[58,24]],b:[60,52,56,50]},k:[["ligne","alignee","compact","reste"],["rentre","axe","cote ballon","coulisse","glisse"],["homme","attaquant","surveille","zone","regard"]],a:"Rester sur la même ligne que les autres défenseurs, se décaler du côté du ballon et garder un œil sur l’attaquant adverse.",t:"Les défenseurs bougent tous ensemble, comme une seule équipe : toute la ligne se décale du côté du ballon."},
{c:"Offensif",q:"Tu as le ballon, ton milieu est marqué. Quelle option ?",s:{m:[35,32,40,32],u:[[35,10],[50,32],[35,54]],o:[[52,28],[52,38],[60,20]],b:[35,32,40,32]},k:[["lateral","cote","gardien"],["conduite","avance","montee","percut"],["casse","ligne","longue","avant","attaquant"]],a:"Avancer avec le ballon pour attirer un adversaire, ou passer à travers la défense avec une passe vers l’avant.",t:"Avancer avec le ballon attire un adversaire : cela libère tout de suite un coéquipier."}]},
M:{n:"Milieu central (MC)",l:[
{c:"Sans ballon",q:"Ton partenaire a le ballon. Comment te rends-tu disponible ?",s:{m:[50,32,58,22],u:[[45,48],[30,32]],o:[[56,30],[58,40],[48,22]],b:[45,48]},k:[["demarqu","espace","libre","angle","triangle"],["appel","course","mouvement","bouge","deplace"],["regard","vision","epaule","scan"]],a:"T’échapper de ton adversaire dans l’espace libre pour offrir une passe facile, après avoir regardé autour de toi.",t:"Ne reste jamais caché derrière un adversaire : place-toi entre deux adversaires, bien visible pour celui qui a le ballon."},
{c:"Offensif",q:"Tu reçois le ballon dos au jeu avec un adversaire qui te presse. Que faire ?",s:{m:[50,32],u:[[38,22],[60,12,66,12]],o:[[56,30,53,30],[56,36]],b:[38,22,50,32]},k:[["controle","orient","retourne","demi-tour"],["une touche","simple","protege","corps","dos"],["passe","remise","partenaire","soutien"]],a:"Protéger le ballon avec le corps, puis remise simple ou se retourner si possible.",t:"Regarde par-dessus l’épaule AVANT la passe : tu sais déjà quoi faire à la réception."},
{c:"Défensif",q:"Tu perds le ballon et ton équipe est mal placée. Réaction ?",s:{m:[55,32,40,32],u:[[45,12],[45,52]],o:[[60,32,45,32],[62,20,50,20],[62,44,50,44]],b:[60,32,45,32]},k:[["repli","recul","retour","coupe"],["pression","presse","ralenti","frein"],["passe","ligne","couvre","axe"]],a:"Revenir en défense, ralentir le joueur qui a le ballon et couper la passe au milieu.",t:"Les 3 secondes après une perte : soit tu mets la pression, soit tu reviens en défense. Mais jamais rien."},
{c:"Contre-attaque",q:"Tu récupères le ballon, deux coéquipiers partent. Que fais-tu ?",s:{m:[45,32,55,32],u:[[60,14,80,12],[60,50,80,50]],o:[[70,32],[72,22]],b:[45,32,60,14]},k:[["vite","rapide","direct","vertical","avant"],["passe","jou","donne"],["course","appel","espace","profondeur"]],a:"Jouer vite et vers l’avant dans la course d’un coéquipier lancé.",t:"Passe dans l’espace devant lui, pas dans ses pieds, pour qu’il garde sa vitesse."}]},
A:{n:"Avant-centre (AC)",l:[
{c:"Sans ballon",q:"Ton équipe attaque du côté opposé. Que fais-tu ?",s:{m:[70,30,82,38],u:[[50,50,70,52],[60,12]],o:[[78,26,76,30],[78,40]],b:[50,50,70,52]},k:[["demarqu","cache","dos","defenseur","epaule"],["course","appel","profondeur","bouge","entre"],["second poteau","poteau","surface","zone","ballon"]],a:"Te placer derrière le défenseur et courir vers le second poteau.",t:"Le défenseur ne peut pas regarder à la fois le ballon et toi : place-toi dans son angle mort."},
{c:"Offensif",q:"Tu reçois le ballon dos au but avec un défenseur collé derrière toi. Que fais-tu ?",s:{m:[75,32],u:[[55,22,70,20],[60,50,72,44]],o:[[80,32],[84,20]],b:[58,32,75,32]},k:[["protege","corps","bras","dos"],["remise","passe","jou","partenaire","soutien"],["retourne","tourne","demi-tour","pivot"]],a:"Protéger le ballon avec ton corps, puis le redonner à un coéquipier qui monte.",t:"Pose ton corps entre le ballon et le défenseur. Une remise en une touche fait monter toute l’équipe."},
{c:"Défensif",q:"Perte de balle dans le camp adverse. Quelle est ta réaction ?",s:{m:[72,32,78,28],u:[[60,16,70,18],[60,48,70,46]],o:[[84,32,70,28],[86,22,76,30]],b:[78,34,72,30]},k:[["pression","presse","reaction","contre-pressing","gegenpress"],["ferme","coupe","ligne de passe","oriente"],["ensemble","equipe","collectif","coequip","mont"]],a:"Mettre tout de suite la pression sur le joueur qui a le ballon et bloquer les passes, avec toute l’équipe.",t:"Mettre la pression tout seul ne sert à rien : fais-le en même temps que tes coéquipiers, sinon reviens en défense."},
{c:"Contre-attaque",q:"Ton équipe récupère le ballon, tu es devant 2 défenseurs. Que fais-tu ?",s:{m:[60,32,92,32],u:[[50,14,80,12],[50,50,80,50]],o:[[85,24,80,28],[85,40,80,38]],b:[44,32,70,32]},k:[["attend","patient","fixe","ecart"],["course","appel","profondeur","derriere","ligne"],["decale","partenaire","ailier","passe"]],a:"Faire une course derrière la défense pour écarter les défenseurs, puis passer à un partenaire.",t:"Ta course crée l’espace pour les autres, même si tu ne touches pas le ballon."}]},
LD:{n:"Latéral droit (LD)",l:[
{c:"Offensif",q:"Ton ailier rentre vers le milieu avec le ballon. Que fais-tu ?",s:{m:[45,52,70,56],u:[[55,40,62,34]],o:[[60,48,58,50],[62,30]],b:[55,40,62,34]},k:[["course","depasse","double","exterieur","appel"],["largeur","ligne","aile","ecart"],["centre","passe","debord","profondeur"]],a:"Passer à l’extérieur de l’ailier pour déborder sur le côté et laisser de la place.",t:"Le latéral qui monte crée un 2 contre 1 sur l’aile : l’ailier doit voir que tu arrives."},
{c:"Défensif",q:"Un ailier adverse arrive vite sur ton côté. Comment le défends-tu ?",s:{m:[30,52,26,46],u:[[28,36,24,34],[30,20]],o:[[44,54,30,44],[48,30]],b:[44,54,30,44]},k:[["ferme","interieur","axe","oriente","exterieur"],["recul","tempor","patien","pas plonger","ralenti"],["couvr","central","aide","partenaire"]],a:"L’envoyer vers l’extérieur, gagner du temps sans te jeter au sol et compter sur l’aide du défenseur central.",t:"Place-toi du côté du milieu du terrain : oblige-le à aller vers la ligne de touche, loin du but."},
{c:"Sans ballon",q:"Ton équipe attaque de l’autre côté. Où te places-tu ?",s:{m:[50,54,58,50],u:[[60,14,66,18],[40,32]],o:[[68,50],[70,30]],b:[62,14]},k:[["large","largeur","aile","couloir"],["haut","avanc","ligne","monte"],["securite","contre","equilibr","surveille","retour"]],a:"Rester sur le côté et haut pour recevoir un changement de côté, tout en surveillant la contre-attaque adverse.",t:"Ta position doit permettre deux choses : recevoir un changement de côté ET protéger l’équipe si on perd le ballon."},
{c:"Contre-attaque",q:"Tu récupères le ballon dans ta moitié, l’aile est libre devant toi.",s:{m:[35,52,70,56],u:[[55,30,82,26],[50,16,78,14]],o:[[60,50],[64,32]],b:[35,52,70,56]},k:[["conduite","avance","monte","court","vite","percut"],["centre","passe","avant","attaquant"],["regard","tete","vision","scan","option"]],a:"Conduire vite le ballon sur le côté libre, puis servir un attaquant lancé.",t:"Dans l’espace libre, avance : le défenseur adverse doit choisir entre toi et ton coéquipier."}]},
MDC:{n:"Milieu défensif (MDC)",l:[
{c:"Sans ballon",q:"Ton équipe attaque. Où te places-tu pour protéger ta défense ?",s:{m:[45,32,42,32],u:[[65,32,72,32],[60,14],[60,50]],o:[[55,26],[55,38],[70,24]],b:[65,32,72,32]},k:[["devant","protege","defense","filtre"],["equilibr","securite","contre","rest"],["axe","centre","ligne de passe","passe"]],a:"Rester devant la défense, au milieu, pour couper les passes et protéger l’équipe si on perd le ballon.",t:"Le MDC est le verrou : toujours entre le ballon et ses défenseurs."},
{c:"Défensif",q:"L’adversaire a le ballon entre ta défense et ton milieu. Que fais-tu ?",s:{m:[42,32,48,30],u:[[35,14],[35,50],[30,32]],o:[[52,30,45,30],[58,40],[60,20]],b:[52,30,45,30]},k:[["pression","presse","ferme"],["orient","bloque","retourn","empeche"],["couvr","aide","partenaire","coequip"]],a:"Mettre la pression sur le joueur qui a le ballon pour l’empêcher de se retourner, avec l’aide des défenseurs.",t:"Face au but il est dangereux, dos au but il est bloqué : empêche-le de se retourner."},
{c:"Offensif",q:"Tu reçois le ballon entre la défense et le milieu adverses. Quel est ton premier réflexe ?",s:{m:[48,32,50,32],u:[[35,14],[35,50],[62,22,70,22],[62,42]],o:[[56,28],[56,38]],b:[35,14,48,32]},k:[["regard","scan","vision","tete","epaule"],["une touche","simple","rapide","vite","court"],["lateral","cote","distribu","passe","jou"]],a:"Regarder autour de toi avant de recevoir, puis jouer simple et vite pour changer de côté.",t:"Le MDC organise : regarde 2 ou 3 fois avant de recevoir, joue en 1 ou 2 touches."},
{c:"Contre-attaque",q:"L’adversaire contre-attaque, tu es le premier à revenir.",s:{m:[50,32,38,32],u:[[30,20],[30,44]],o:[[66,32,50,32],[68,22,52,24]],b:[66,32,50,32]},k:[["recul","repli","retour"],["tempor","ralenti","retard","patien","pas plonger"],["axe","coupe","passe","ferme"]],a:"Revenir vite, gagner du temps et couper le passage au milieu sans te jeter au sol.",t:"Reculer et ralentir = ton équipe revient. Ton seul rôle : gagner 3 secondes."}]},
MOC:{n:"Milieu offensif (MOC)",l:[
{c:"Sans ballon",q:"Ton équipe construit. Où te places-tu ?",s:{m:[62,32,66,38],u:[[45,32],[50,14],[50,50]],o:[[56,26],[56,38],[68,30]],b:[45,32]},k:[["entre","ligne","espace","poche"],["demarqu","libre","angle","passe"],["epaule","regard","scan","dos"]],a:"Se placer entre la défense et le milieu adverses, dans le dos des milieux, en restant disponible.",t:"Entre la défense et le milieu adverses, tu dois pouvoir recevoir ET te retourner."},
{c:"Offensif",q:"Tu reçois face au but. Que fais-tu ?",s:{m:[70,32,76,32],u:[[78,14,86,18],[78,50,86,46],[60,32]],o:[[80,28],[80,38]],b:[60,32,70,32]},k:[["passe","decisive","dernier","avant","profondeur"],["tir","frappe","but"],["regard","tete","vision","scan","option"]],a:"Choisir vite entre la dernière passe vers l’avant et le tir.",t:"Un MOC a 2 secondes : si tu hésites, il n’y a plus d’espace."},
{c:"Défensif",q:"Perte de balle, ton équipe est haute. Que fais-tu ?",s:{m:[65,32,58,32],u:[[50,32],[60,16],[60,48]],o:[[70,30,60,30],[72,40]],b:[70,30,60,30]},k:[["pression","presse","contre","immediat"],["ferme","coupe","passe","axe","oriente"],["coequip","ensemble","collectif","partenaire"]],a:"Mettre tout de suite la pression sur le joueur qui a le ballon et couper la passe au milieu, avec tes coéquipiers.",t:"Un MOC qui presse bien gagne le ballon à 30 m du but adverse."},
{c:"Contre-attaque",q:"Ton équipe récupère et part vite. Quel est ton rôle ?",s:{m:[45,32,70,32],u:[[50,14,80,12],[50,50,80,52]],o:[[75,28],[75,40]],b:[40,32,60,32]},k:[["soutien","accompagne","suit","monte","derriere"],["relais","remise","jou","passe"],["espace","course","profondeur","oppose"]],a:"Suivre l’action, faire le lien avec les autres et courir dans l’espace libre.",t:"Sois le 3e homme : arrive lancé depuis l’arrière, pas à l’arrêt."}]},
ALD:{n:"Ailier droit (ALD)",l:[
{c:"Offensif",q:"Tu as le ballon sur l’aile face à ton latéral adverse.",s:{m:[70,54,82,42],u:[[85,32],[65,32],[78,20]],o:[[78,50,76,48],[76,36]],b:[70,54,82,42]},k:[["dribble","un contre un","1v1","passe","feinte"],["centre","tir","interieur","repique","axe"],["profondeur","vitesse","aile","exterieur"]],a:"Passer ton adversaire (dribble ou feinte) puis centrer ou rentrer vers le milieu pour frapper.",t:"Change de rythme : le défenseur est prêt pour ta vitesse normale, pas pour une accélération soudaine."},
{c:"Sans ballon",q:"Ton équipe attaque de l’autre côté. Que fais-tu ?",s:{m:[70,54,78,44],u:[[70,12,76,16],[55,32]],o:[[75,48],[74,28]],b:[70,12]},k:[["large","largeur","aile","etire"],["course","appel","profondeur","derriere","bouge"],["second poteau","poteau","surface","entre"]],a:"Rester large pour étirer, puis attaquer le second poteau au bon moment.",t:"Sur un changement de côté, tu dois être prêt à recevoir seul et à jouer ton 1 contre 1."},
{c:"Défensif",q:"Ton latéral monte et l’adversaire récupère. Que fais-tu ?",s:{m:[70,54,45,50],u:[[40,40],[55,32]],o:[[62,50,50,50],[70,40]],b:[62,50,50,50]},k:[["repli","recul","retour","couvr"],["ferme","coupe","passe","aide","soutien"],["lateral","partenaire","coequip"]],a:"Revenir derrière le ballon et aider le latéral à fermer le côté.",t:"Un ailier qui revient en défense, c’est un latéral qui défend à 2 contre 1."},
{c:"Contre-attaque",q:"Ton équipe récupère le ballon, tu es sur l’aile.",s:{m:[50,54,85,48],u:[[55,32,85,32],[50,14,80,16]],o:[[70,48],[75,30],[72,22]],b:[44,32,55,32]},k:[["course","profondeur","vite","sprint","appel"],["large","aile","largeur","exterieur"],["centre","passe","avant","attaquant","interieur"]],a:"Sprinter dans l’espace sur l’aile pour étirer la défense puis servir au centre.",t:"Ne rentre pas vers le milieu : reste sur le côté pour laisser de la place à l’avant-centre."}]},
BU:{n:"Buteur (BU)",l:[
{c:"Sans ballon",q:"Un centre arrive de l’aile. Comment te places-tu dans la surface ?",s:{m:[78,32,90,30],u:[[70,56,84,50],[70,10]],o:[[84,26],[84,38]],b:[70,56,88,32]},k:[["demarqu","cache","dos","defenseur","epaule"],["premier poteau","second poteau","poteau","zone"],["course","appel","tempo","retard","attaque"]],a:"Se démarquer du défenseur et attaquer le premier ou le second poteau avec un temps de retard.",t:"Le défenseur regarde le ballon : bouge dans son dos juste avant le centre."},
{c:"Offensif",q:"Tu es face au gardien, 1 contre 1. Que fais-tu ?",s:{m:[80,32,90,32],u:[[78,18],[78,46]],o:[[96,32]],b:[78,32,92,32]},k:[["calme","tete","regard","gardien","observe"],["placement","coin","ras","lucarne","angle"],["froid","sang","tir","frappe","finition"]],a:"Rester calme, lire le gardien et finir dans le coin opposé à sa position.",t:"Regarde le gardien, pas le ballon : vise le côté où il est le moins bien placé."},
{c:"Défensif",q:"Ton équipe perd le ballon. Que fais-tu en tant que buteur ?",s:{m:[75,32,68,32],u:[[60,16,70,18],[60,48,70,46]],o:[[70,30,62,30]],b:[70,30,62,30]},k:[["pression","presse","gene","ferme"],["axe","centre","couvr","passe"],["equipe","collectif","coequip","ensemble"]],a:"Mettre la pression sur le joueur qui a le ballon et fermer le milieu pour le faire se tromper.",t:"Un buteur qui presse offre plusieurs occasions de plus par match."},
{c:"Contre-attaque",q:"Contre-attaque : le ballon part sur l’aile, tu es à 25 m du but.",s:{m:[65,32,88,32],u:[[60,52,85,52],[60,12,82,12]],o:[[80,26],[80,38]],b:[55,52,85,52]},k:[["course","appel","profondeur","attaque","sprint"],["centre","poteau","surface","zone"],["vite","rapide","direct","avant"]],a:"Courir vers la surface pour attaquer le centre et marquer.",t:"Ne ralentis pas : entre dans la surface à pleine vitesse."}]}};
const EX={
