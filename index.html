.alb .mc.l,.alb .mc.l:nth-child(3n+1),.alb .mc.l:nth-child(3n){animation:mcIn .6s cubic-bezier(.2,.9,.3,1.25) backwards,shn 5s linear infinite}

.pkmu{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:6;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:20px;padding:8px 14px}

/* =====================================================================
   V6 : ANIMATIONS PLUS BELLES
   (bloc ajouté : n'écrase rien, redéfinit seulement quelques @keyframes)
   ===================================================================== */

/* --- transitions de thème douces --- */
body{transition:background-color .45s ease,color .45s ease}
.card,.qc,.seg button,#bar,#dock,.sh,.hint{transition:background-color .45s ease,border-color .35s ease,color .45s ease,box-shadow .3s ease,translate .3s cubic-bezier(.2,.9,.3,1),scale .15s ease}

/* --- entrée des écrans : tout arrive en cascade --- */
@keyframes viewIn{from{opacity:0;translate:0 22px;scale:.985}}
#app>*:not(.pc):not(.hero):not(.ttl){animation:viewIn .6s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes heroIn{from{opacity:0;translate:0 26px;scale:.96}}
.hero{animation:heroIn .85s cubic-bezier(.2,.9,.3,1) backwards}

/* --- HERO : projecteurs, pelouse qui défile, titre brillant, ballon qui rebondit --- */
@keyframes flood{from{transform:rotate(-9deg) scale(1.25);opacity:.55}to{transform:rotate(9deg) scale(1.25);opacity:1}}
.hero::before{content:"";position:absolute;inset:-30% -10% 0;z-index:0;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 0;background:conic-gradient(from 195deg at 50% 0,transparent 0 8%,rgba(255,255,255,.2) 12%,transparent 17% 40%,rgba(255,255,255,.16) 45%,transparent 50% 100%);animation:flood 7s ease-in-out infinite alternate}
@keyframes grass{to{background-position:64px 0}}
.hero::after{animation:grass 5s linear infinite}
@keyframes bnc{0%,100%{transform:translateY(5px) scale(1.2,.8) rotate(0deg);animation-timing-function:cubic-bezier(.15,.75,.3,1)}
 48%{transform:translateY(-22px) scale(.95,1.07) rotate(190deg);animation-timing-function:ease-in}
 52%{transform:translateY(-22px) scale(.95,1.07) rotate(215deg);animation-timing-function:cubic-bezier(.7,0,.85,.3)}
 94%{transform:translateY(0) scale(1,1) rotate(360deg)}}
.hero .ball{filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
@keyframes ttlShine{to{background-position:-250% 0}}
.hero h1{text-shadow:none;color:transparent;background:linear-gradient(100deg,#fff 0 38%,color-mix(in srgb,var(--ac) 35%,#fff) 46%,#fff 54% 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--ac) 70%,transparent));animation:ttlShine 4.5s linear infinite}
@keyframes chipIn{from{opacity:0;translate:0 14px;scale:.7}}
.hero .chips span{animation:chipIn .6s cubic-bezier(.2,1.5,.4,1) backwards;backdrop-filter:blur(4px)}
@keyframes txIn2{from{opacity:0;translate:0 12px}}
.hero .tg,.hero p{animation:txIn2 .7s .35s backwards}
.cta{position:relative;overflow:hidden}
@keyframes ctaShine{0%,55%{translate:-130% 0}100%{translate:130% 0}}
.cta::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);mix-blend-mode:soft-light;animation:ctaShine 3.4s 1.2s ease-in-out infinite}

/* --- boutons : relief, reflet, rebond au clic, ondulation --- */
.btn,.qb,.seg button,#bar button,.lkr{position:relative;overflow:hidden}
.btn,.cta{transition:translate .2s cubic-bezier(.2,.9,.3,1),box-shadow .25s,filter .2s,scale .12s ease}
.btn:not([disabled]):active,.cta:active{scale:.95}
.btn:not(.o):not([disabled])::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);translate:-130% 0;transition:translate .7s ease}
@media (hover:hover){
 .btn:not([disabled]):hover,.cta:hover{translate:0 -2px;box-shadow:0 10px 22px color-mix(in srgb,var(--ac) 35%,transparent)}
 .btn:not(.o):not([disabled]):hover::after{translate:130% 0}
 .seg button:hover{translate:0 -2px;border-color:color-mix(in srgb,var(--ac) 60%,var(--bd))}
 .card:hover{box-shadow:0 10px 26px rgba(0,0,0,.12)}
}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.22;pointer-events:none;scale:0;animation:rpl .65s ease-out forwards}
@keyframes rpl{to{scale:1;opacity:0}}
#bar b{transition:scale .2s}#bar b:active{scale:.93}
@keyframes selPop{40%{scale:1.07}}
.seg button.on{animation:selPop .4s cubic-bezier(.2,1.5,.4,1)}

/* --- terrain tactique de l'accueil : joueurs qui apparaissent, poste choisi qui pulse --- */
@keyframes dotIn{from{scale:0;opacity:0}}
.tac .dot{animation:dotIn .55s cubic-bezier(.2,1.6,.4,1) backwards;transition:transform .15s,scale .2s,background-color .2s,box-shadow .2s}
@keyframes dotPulse{0%{box-shadow:0 0 0 5px rgba(245,179,1,.6),0 5px 12px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 22px rgba(245,179,1,0),0 5px 12px rgba(0,0,0,.4)}}
.tac .dot.on{animation:dotPulse 1.6s ease-out infinite}
@media (hover:hover){.tac .dot:not(.on):hover{scale:1.12}}

/* --- schéma de la question : terrain animé (joueurs, ballon, flèches) --- */
@keyframes pitchIn{from{opacity:0;translate:0 14px;scale:.97}}
svg.pitch{animation:pitchIn .7s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes plPop{from{transform:scale(0);opacity:0}}
.pitch .pl>*{transform-box:fill-box;transform-origin:50% 50%;animation:plPop .55s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ants{to{stroke-dashoffset:-2.8}}
.pitch line[stroke-dasharray]{animation:none}
@keyframes pring{from{transform:scale(1);opacity:.95}to{transform:scale(3.6);opacity:0}}
.pitch .pring{fill:none;stroke:#f5b301;stroke-width:.5;transform-box:fill-box;transform-origin:center;animation:pring 1.8s ease-out infinite}

/* --- quiz : barre de progression, réponses QCM, retours --- */
.prog i{background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff),var(--ac));background-size:200% 100%;animation:prgShine 2s linear infinite;transition:width .6s cubic-bezier(.2,.8,.2,1)}
@keyframes prgShine{to{background-position:-200% 0}}
@keyframes tlPop{from{scale:.5 .3;opacity:.3}}
.tl i.g:has(+ i.c),.tl i.o:has(+ i.c),.tl i.r:has(+ i.c){animation:tlPop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes tlCur{50%{outline-color:var(--ac);outline-offset:2px}}
.tl i.c{animation:tlCur 1.4s ease-in-out infinite}
.tl i{transition:background-color .4s}
@keyframes qbIn{from{opacity:0;translate:-18px 0;scale:.96}}
.qo .qb:not(.qy):not(.qn){animation:qbIn .5s cubic-bezier(.2,.9,.3,1.15) backwards}
.qb{transition:transform .12s,border-color .25s,background-color .25s,box-shadow .3s,scale .15s,translate .2s}
@keyframes qyp{0%{scale:1}35%{scale:1.06}65%{scale:.99}100%{scale:1}}
.qb.qy{box-shadow:0 0 0 4px rgba(22,163,74,.22),0 10px 26px rgba(22,163,74,.35)}
.qb.qn{box-shadow:0 0 0 4px rgba(220,38,38,.18)}
@media (hover:hover){.qb:not(:disabled):hover{border-color:var(--ac);translate:4px 0}}
@keyframes fxIn{0%{transform:translateX(-50%) translateY(-36px) scale(.5);opacity:0}14%{transform:translateX(-50%) translateY(4px) scale(1.15);opacity:1}24%{transform:translateX(-50%) scale(.97)}32%{transform:translateX(-50%) scale(1)}82%{opacity:1;transform:translateX(-50%)}100%{transform:translateX(-50%) translateY(-14px) scale(.95);opacity:0}}
.fx.g{box-shadow:0 10px 30px rgba(22,163,74,.5),0 0 44px rgba(101,163,13,.45)}
.fx.m{box-shadow:0 10px 30px rgba(217,119,6,.45)}
@keyframes fxc{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:1}35%{transform:translate(calc(var(--x)*.85),calc(var(--y)*.85)) rotate(calc(var(--r)*.5)) scale(1.1);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 170px)) rotate(var(--r)) scale(.7);opacity:0}}
.fxc:nth-child(3n){border-radius:50%;width:9px;height:9px}.fxc:nth-child(4n){width:5px;height:16px}

/* --- barres de stats : elles se remplissent --- */
@keyframes barGrow{from{width:0}}
.bar i{animation:barGrow 1.1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes barUp{from{transform:scaleY(0)}}
.bars i{transform-origin:bottom;animation:barUp .8s cubic-bezier(.2,1.2,.4,1) backwards}

/* --- menu (vestiaire) et fiches (sheet) --- */
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{translate:0 100%}}
#sheet:not([hidden]){animation:fadeIn .3s ease}
#sheet:not([hidden])>div{animation:sheetUp .5s cubic-bezier(.2,.9,.25,1)}
@keyframes vestIn{from{opacity:0;scale:1.04}}
#vest:not([hidden]){animation:vestIn .35s ease}
@keyframes lkIn{from{opacity:0;translate:0 30px;rotate:-3deg}}
.lkr{animation:lkIn .5s cubic-bezier(.2,.9,.3,1.2) backwards;transition:translate .2s,border-color .2s}
@media (hover:hover){.lkr:hover{translate:0 -3px;border-color:#94a3b8}}
@keyframes dockIn{from{translate:0 100%;opacity:0}}
#dock:not([hidden]){animation:dockIn .45s cubic-bezier(.2,.9,.3,1) backwards}
#dock input{transition:border-color .2s,box-shadow .25s}
#dock input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}

/* --- ouverture de pack : aura, vignette, étincelles, confettis, carte qui se dévoile --- */
@keyframes aura{0%,100%{scale:.85;opacity:.55}50%{scale:1.15;opacity:.95}}
#pk::before{content:"";position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--rc,#f5b301) 55%,transparent),transparent 66%);animation:aura 2.4s ease-in-out infinite}
#pk.t3::before{animation-duration:1.4s}
#pk{box-shadow:inset 0 0 180px 50px rgba(0,0,0,.7)}
@keyframes rise{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}50%{transform:translate(20px,-36vh) scale(.8)}100%{transform:translate(-16px,-76vh) scale(.1);opacity:0}}
.sp{box-shadow:0 0 10px 2px var(--rc)}.sp:nth-child(3n){width:4px;height:4px}.sp:nth-child(4n){width:9px;height:9px;filter:blur(1px)}
@keyframes fall{0%{transform:translate(0,0) rotate(0) rotateY(0)}25%{transform:translate(26px,28vh) rotate(180deg) rotateY(180deg)}50%{transform:translate(-22px,55vh) rotate(360deg) rotateY(360deg)}75%{transform:translate(20px,82vh) rotate(540deg) rotateY(540deg)}100%{transform:translate(-10px,112vh) rotate(720deg) rotateY(720deg)}}
.cf:nth-child(3n){border-radius:50%;width:10px;height:10px}.cf:nth-child(4n){width:6px;height:20px}
@keyframes wipe{from{clip-path:inset(0 0 100% 0 round 12px)}to{clip-path:inset(0 0 0 0 round 12px)}}
#pk .fph{animation:wipe .9s .35s cubic-bezier(.2,.8,.2,1) backwards}
#pk .ftop{animation:txIn .5s .5s backwards}
@keyframes starPop{from{scale:0;rotate:-90deg;opacity:0}}
#pk .stars{animation:starPop .6s 1s cubic-bezier(.2,1.6,.4,1) backwards}
#pk .btn{animation:txIn .6s 1.1s backwards}

 #app>*,.hero,.hero::before,.hero::after,.hero h1,.hero .chips span,.hero .tg,.hero p,.cta::after,.tac .dot,.tac .dot.on,.qo .qb,.tl i,.prog i,.bar i,.bars i,#sheet,#sheet>div,#vest,.lkr,#dock,.seg button.on,#pk::before,#pk .fph,#pk .ftop,#pk .stars,#pk .btn,svg.pitch,.pitch *,.rpl,.sp,.cf,.fxc{animation:none!important;transition:none!important}

/* ===== Bonus : toasts, série, commentateur ===== */
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:#0f172a;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.4);border:2px solid var(--gold);pointer-events:none;animation:tIn .35s cubic-bezier(.2,1.5,.4,1),tOut .4s 2.2s forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes tIn{from{transform:translateX(-50%) translateY(-30px) scale(.7);opacity:0}}
@keyframes tOut{to{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.combo{display:inline-block;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;border-radius:20px;padding:2px 10px;font-size:.85rem;font-weight:800;margin-left:6px;animation:cb .5s cubic-bezier(.2,1.6,.4,1)}

{c:"Contre-attaque",q:"Tu récupères le ballon, deux coéquipiers partent. Que fais-tu ?",s:{m:[45,32,55,32],u:[[60,14,80,12],[60,50,80,50]],o:[[70,32],[72,22]],b:[45,32,60,14]},k:[["vite","rapide","direct","vertical","avant"],["passe","jou","donne"],["course","appel","espace","profondeur"]],a:"Jouer vite et vers l’avant dans la course d’un coéquipier lancé.",t:"Passe dans l’espace devant lui, pas dans ses pieds, pour qu’il garde sa vitesse."}]},

MDC:{n:"Milieu défensif (MDC)",l:[

{c:"Défensif",q:"L’adversaire a le ballon entre ta défense et ton milieu. Que fais-tu ?",s:{m:[42,32,48,30],u:[[35,14],[35,50],[30,32]],o:[[52,30,45,30],[58,40],[60,20]],b:[52,30,45,30]},k:[["pression","presse","ferme"],["orient","bloque","retourn","empeche"],["couvr","aide","partenaire","coequip"]],a:"Mettre la pression sur le joueur qui a le ballon pour l’empêcher de se retourner, avec l’aide des défenseurs.",t:"Face au but il est dangereux, dos au but il est bloqué : empêche-le de se retourner."},

ALD:{n:"Ailier droit (ALD)",l:[

{c:"Défensif",q:"Ton latéral monte et l’adversaire récupère. Que fais-tu ?",s:{m:[70,54,45,50],u:[[40,40],[55,32]],o:[[62,50,50,50],[70,40]],b:[62,50,50,50]},k:[["repli","recul","retour","couvr"],["ferme","coupe","passe","aide","soutien"],["lateral","partenaire","coequip"]],a:"Revenir derrière le ballon et aider le latéral à fermer le côté.",t:"Un ailier qui revient en défense, c’est un latéral qui défend à 2 contre 1."},
{c:"Contre-attaque",q:"Ton équipe récupère le ballon, tu es sur l’aile.",s:{m:[50,54,85,48],u:[[55,32,85,32],[50,14,80,16]],o:[[70,48],[75,30],[72,22]],b:[44,32,55,32]},k:[["course","profondeur","vite","sprint","appel"],["large","aile","largeur","exterieur"],["centre","passe","avant","attaquant","interieur"]],a:"Sprinter dans l’espace sur l’aile pour étirer la défense puis servir au centre.",t:"Ne rentre pas vers le milieu : reste sur le côté pour laisser de la place à l’avant-centre."}]},
BU:{n:"Buteur (BU)",l:[

{c:"Offensif",q:"Tu es face au gardien, 1 contre 1. Que fais-tu ?",s:{m:[80,32,90,32],u:[[78,18],[78,46]],o:[[96,32]],b:[78,32,92,32]},k:[["calme","tete","regard","gardien","observe"],["placement","coin","ras","lucarne","angle"],["froid","sang","tir","frappe","finition"]],a:"Rester calme, lire le gardien et finir dans le coin opposé à sa position.",t:"Regarde le gardien, pas le ballon : vise le côté où il est le moins bien placé."},
{c:"Défensif",q:"Ton équipe perd le ballon. Que fais-tu en tant que buteur ?",s:{m:[75,32,68,32],u:[[60,16,70,18],[60,48,70,46]],o:[[70,30,62,30]],b:[70,30,62,30]},k:[["pression","presse","gene","ferme"],["axe","centre","couvr","passe"],["equipe","collectif","coequip","ensemble"]],a:"Mettre la pression sur le joueur qui a le ballon et fermer le milieu pour le faire se tromper.",t:"Un buteur qui presse offre plusieurs occasions de plus par match."},
{c:"Contre-attaque",q:"Contre-attaque : le ballon part sur l’aile, tu es à 25 m du but.",s:{m:[65,32,88,32],u:[[60,52,85,52],[60,12,82,12]],o:[[80,26],[80,38]],b:[55,52,85,52]},k:[["course","appel","profondeur","attaque","sprint"],["centre","poteau","surface","zone"],["vite","rapide","direct","avant"]],a:"Courir vers la surface pour attaquer le centre et marquer.",t:"Ne ralentis pas : entre dans la surface à pleine vitesse."}]}};

{c:"Défensif",q:"Ton équipe défend en bloc et le ballon est sur l’aile. Où te places-tu ?",s:{m:[48,32,50,40],u:[[46,52,50,50],[44,14],[36,30]],o:[[56,54,52,52],[62,40],[58,24]],b:[56,54,52,52]},k:[["compact","serre","ligne","distance","bloc","groupe"],["cote","ballon","glisse","coulisse","decale","deplace"],["axe","protege","passe","couvre","interieur","centre"]],a:"Te décaler vers le ballon en restant compact avec tes partenaires et protéger l’axe.",t:"Le côté opposé au ballon est le moins dangereux : ferme l’axe en premier, le couloir peut attendre."},
{c:"Sans ballon",q:"Ton partenaire a le ballon et s’apprête à le donner à l’attaquant en remise. Quelle course fais-tu ?",s:{m:[48,32,64,24],u:[[54,46],[74,32]],o:[[62,44,56,42],[76,30],[62,30]],b:[54,46,70,34]},k:[["course","appel","derriere","espace","profondeur","bouge"],["troisieme","relais","remise","mur","homme","soutien"],["timing","moment","tard","quand","retard","tempo"]],a:"Lancer une course dans l’espace derrière le marquage pour recevoir la remise, comme troisième homme, au bon moment.",t:"Pars quand l’attaquant touche le ballon, pas avant : le troisième homme surprend en arrivant lancé."},
{c:"Contre-attaque",q:"Tu récupères le ballon mais un seul partenaire est devant, avec deux adversaires qui reviennent. Que fais-tu ?",s:{m:[48,32,54,32],u:[[68,30,78,30],[38,22],[40,44]],o:[[62,26,58,28],[64,38,58,36]],b:[48,32,54,32]},k:[["calme","patien","ralenti","temps","tempo","attend"],["garde","protege","conserve","ballon","simple","possession"],["equipe","coequip","monte","soutien","partenaire","arrive"]],a:"Garder le ballon, ralentir le jeu et attendre que l’équipe monte plutôt que forcer une passe risquée.",t:"Une contre-attaque à 1 contre 2 n’en est pas une : mieux vaut garder le ballon que le perdre à 40 m du but."},
{c:"Offensif",q:"Tu as le ballon et l’ailier opposé est complètement seul. Que fais-tu ?",s:{m:[52,32,54,32],u:[[46,50],[40,24],[66,12,70,12]],o:[[56,50],[58,40],[60,26]],b:[52,32,66,12]},k:[["changement","cote","long","aile","oppose","diagonale"],["regard","scan","tete","vision","observe","lis"],["precis","pied","passe","timing","moment","tendu"]],a:"Regarder le terrain puis changer de côté par une passe longue et précise vers l’ailier isolé.",t:"Quand l’adversaire a tout fermé d’un côté, l’autre est vide : un changement d’aile met plusieurs joueurs hors de position."}
],
MDC:[

{c:"Offensif",q:"Ton gardien te passe le ballon et un adversaire est à 5 mètres. Que fais-tu ?",s:{m:[30,32,32,32],u:[[10,32],[24,12],[24,52]],o:[[34,34,32,33],[40,24],[42,42]],b:[10,32,28,32]},k:[["touche","simple","rapide","vite","court","direct"],["passe","defenseur","lateral","remise","retour","joue"],["regard","scan","tete","vision","epaule","avant"]],a:"Regarder avant de recevoir puis jouer en une touche vers un défenseur ou un latéral libre.",t:"Si tu prends deux touches avec un adversaire à 5 m, tu perds le ballon : décide avant qu’il arrive."},
{c:"Défensif",q:"Corner adverse : où te places-tu pour aider ta défense ?",s:{m:[22,32,18,32],u:[[8,28],[8,38],[10,44],[10,22]],o:[[10,31],[12,36],[16,26],[20,40]],b:[1,1,10,32]},k:[["devant","limite","surface","zone","penalty","entree"],["rebond","second","repousse","reprise","frappe","loin"],["marque","adversaire","homme","colle","surveille","ballon"]],a:"Te placer à l’entrée de la surface pour récupérer les ballons repoussés et empêcher la frappe de loin.",t:"Un corner a deux dangers : la tête dans la surface et la reprise de volée à 20 m. Toi, tu t’occupes de la deuxième."},

{c:"Sans ballon",q:"Ton équipe attaque haut. Où te places-tu pour récupérer les ballons perdus ?",s:{m:[52,32,54,32],u:[[74,20],[74,44],[66,32],[40,22],[40,42]],o:[[80,30],[82,40],[66,50]],b:[74,20,80,30]},k:[["derriere","equilibr","securite","reste","protege","arriere"],["milieu","axe","centre","ligne","terrain"],["recup","rebond","ballon","contre","second","coupe"]],a:"Rester derrière le ballon, au milieu, pour récupérer les deuxièmes ballons et couper les contre-attaques.",t:"Tu es l’assurance de l’équipe : quand tout le monde attaque, c’est à toi de rester en retrait."}
],
MOC:[

],
ALD:[
{c:"Offensif",q:"Tu as le ballon sur l’aile et le défenseur recule devant toi. Que fais-tu ?",s:{m:[72,54,80,50],u:[[86,32],[70,34],[80,18]],o:[[78,52,76,50],[82,40],[84,28]],b:[72,54,80,50]},k:[["accelere","vitesse","change","rythme","avance","conduite"],["centre","passe","avant","attaquant","poteau","decale"],["tir","frappe","interieur","rentre","axe","repique"]],a:"Accélérer pour prendre l’espace, puis centrer, passer ou rentrer frapper selon la position du défenseur.",t:"Un défenseur qui recule te laisse du terrain : accélère et force-le à choisir entre te laisser centrer ou te laisser tirer."},

{c:"Offensif",q:"Tu tires un corner. Quelle option choisis-tu ?",s:{m:[98,62,98,62],u:[[84,32],[86,24],[82,42],[70,48]],o:[[86,30],[88,38],[84,26]],b:[98,62,86,34]},k:[["court","partenaire","relais","passe","appui"],["centre","poteau","surface","tete","ballon","tendu"],["regard","vision","observe","signal","vois","scan"]],a:"Regarder la surface et envoyer le ballon sur le premier ou le second poteau, ou jouer court si personne n’est libre.",t:"Avant de frapper, regarde qui est démarqué : un bon corner, c’est un ballon que tu envoies là où tu l’as décidé."}
],
A:[

{c:"Offensif",q:"Tu reçois le ballon à 20 m du but avec un défenseur dans ton dos. Que fais-tu ?",s:{m:[80,32,86,32],u:[[78,16,86,14],[78,48,86,50]],o:[[82,32,80,32],[86,22],[86,42]],b:[60,32,80,32]},k:[["protege","corps","dos","bras","pivot","coince"],["retourne","tourne","tir","frappe","but","orient"],["passe","partenaire","remise","ailier","decale","jou"]],a:"Protéger le ballon avec ton corps puis te retourner pour tirer, ou décaler un partenaire mieux placé.",t:"Ton corps est ton bouclier : garde le défenseur dans ton dos, le ballon loin de lui, et décide dès que tu sens la distance."},

{c:"Offensif",q:"Ton ailier va centrer un ballon tendu. Où te places-tu dans la surface ?",s:{m:[80,32,90,32],u:[[72,56,88,46],[76,20]],o:[[84,28],[84,38],[88,32]],b:[72,56,92,36]},k:[["premier","poteau","devant","court","tendu","rasant"],["course","appel","bouge","attaque","vite","derriere"],["defenseur","marque","devance","dos","demarqu","adversaire"]],a:"Attaquer le premier poteau avec un appel court devant le défenseur pour reprendre un centre tendu.",t:"Sur un centre tendu, le premier poteau est le plus rentable : le ballon arrive vite, tu n’as qu’à le dévier ou le pousser au fond."}
],
BU:[

{c:"Sans ballon",q:"Le gardien adverse a le ballon dans les mains. Où te places-tu ?",s:{m:[80,32,86,34],u:[[72,16],[72,48],[64,32]],o:[[96,32],[88,26],[88,40]],b:[96,32]},k:[["presse","pression","gene","ferme","harcele"],["passe","defenseur","lateral","couvre","coupe","ligne","angle"],["pret","reaction","attend","relance","regard","timing"]],a:"Te placer pour couper la passe vers un défenseur et être prêt à presser dès la relance.",t:"Place-toi entre les deux défenseurs centraux : le gardien devra choisir un côté, et c’est ton équipe qui presse celui-là."},

{c:"Contre-attaque",q:"Contre-attaque : ton ailier a le ballon et deux défenseurs reviennent. Où te places-tu ?",s:{m:[66,32,88,36],u:[[62,12,84,18],[48,32]],o:[[82,28],[84,40],[86,20]],b:[62,12,80,18]},k:[["course","appel","surface","premier","second","poteau"],["ecarte","fixe","defenseur","espace","centre","attire"],["vite","tempo","moment","timing","arrive","lance"]],a:"Attaquer la surface en diagonale vers le premier ou le second poteau pour fixer les défenseurs et offrir un centre.",t:"Arrive au point de penalty en vitesse : trop tôt, tu es collé au défenseur ; trop tard, tu rates le centre."},
{c:"Offensif",q:"Penalty pour ton équipe et tu es le tireur. Que fais-tu ?",s:{m:[82,32,89,32],u:[[78,18],[78,46]],o:[[99,32],[84,22],[84,42]],b:[90,32]},k:[["calme","respire","concentr","confiance","serein","pose"],["coin","angle","cote","choisi","decide","place"],["fort","puissance","precis","ras","lucarne","frappe"]],a:"Rester calme, choisir ton coin avant de tirer et frapper fort et placé, sans changer d’avis au dernier moment.",t:"Un penalty se gagne dans la tête : choisis ton coin avant de partir et tiens-toi à ta décision."}
