<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision de jeu – Quiz foot</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--tx:#13201a;--mu:#5a6a61;--ac:#15803d;--ac2:#fff;--bd:#d8dfda;--gold:#f5b301;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--tx:#e8f0ea;--mu:#9bb0a2;--ac:#4ade80;--ac2:#07210f;--bd:#2a3a30;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--tx:#e8f0ea;--mu:#9bb0a2;--ac:#4ade80;--ac2:#07210f;--bd:#2a3a30;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font:800 1.9rem/1.1 Georgia,serif;margin:8px 0 4px}
h2{font:700 1.15rem Georgia,serif;margin:22px 0 8px}
p{margin:6px 0}.mu{color:var(--mu);font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
button{font:inherit;cursor:pointer}
.pos{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;text-align:left;color:var(--tx)}
.pos:hover,.pos:focus-visible{border-color:var(--ac);outline:none}
.pos b{display:block;font-size:1.05rem}
.btn{background:var(--ac);color:var(--ac2);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.o{background:transparent;color:var(--tx);border:2px solid var(--bd)}
svg.pitch{width:100%;height:auto;border-radius:12px;display:block}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0 4px}
.tag{display:inline-block;background:var(--ac);color:var(--ac2);border-radius:20px;padding:2px 10px;font-size:.85rem;font-weight:700}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:100%}
#dock input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
#dock input:focus{outline:none;border-color:var(--ac)}
.big{font:800 3.4rem/1 Georgia,serif}
.ok{color:var(--ac)}.ko{color:var(--bad)}
.lg{display:grid;gap:7px;margin-top:8px;font-size:.9rem}.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px;border:2px solid var(--bd)}.lg u{display:inline-block;width:28px;border-top:3px dashed #888;margin-right:8px;vertical-align:4px;text-decoration:none}.lg u.y{border-top-color:#f5b301}.lg u.s{border-top:3px solid #000}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 6px;color:var(--tx);text-align:center}.seg button small{display:block;color:var(--mu);font-size:.72rem;line-height:1.2;margin-top:2px}.seg button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.pos{display:flex;align-items:center;gap:10px}.ab{background:var(--ac);color:var(--ac2);border-radius:8px;min-width:42px;text-align:center;font-weight:800;padding:4px 0;font-size:.85rem}
.prog{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:8px}.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.hint{background:color-mix(in srgb,var(--gold) 22%,var(--card));border-radius:10px;padding:8px 12px;font-size:.92rem}
.hero{background:linear-gradient(135deg,#14532d,#2f8f4e);color:#fff;border-radius:16px;padding:18px}.hero h1{margin:0}.hero p{opacity:.92;margin:6px 0 0}
.gl{margin:14px 0 6px;font-weight:700}
.fix{border-left:4px solid var(--gold);padding-left:10px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main id="app"></main>
<div id="dock" hidden><input id="ans" placeholder="Écris ta réponse ici…" autocomplete="off"><button class="btn" id="go">Valider</button></div>
<script>
// Scène: m=toi [x,y,versX,versY], u=coéquipiers, o=adversaires, b=ballon. Terrain 100x64, on attaque vers la droite.
const Q={
G:{n:"Gardien (GB)",l:[
{c:"Contre-attaque",q:"Tu captes un centre. Ton équipe peut partir vite. Que fais-tu ?",s:{m:[5,32],u:[[40,12,75,10],[40,52,70,50],[30,32,60,32]],o:[[60,28],[62,42],[50,20,40,26]],b:[5,32,75,10]},k:[["vite","rapide","immediat","direct"],["relance","lance","main","pied","passe","donne"],["ailier","attaquant","espace","profondeur","course"]],a:"Relancer immédiatement à la main ou au pied vers un coéquipier lancé dans l’espace.",t:"Lève la tête AVANT de capter : repère qui part en profondeur. Les 3 premières secondes après une récupération sont les plus dangereuses."},
{c:"Défensif",q:"Un attaquant arrive seul face à toi. Quelle est ta réaction ?",s:{m:[5,32,12,32],u:[[15,15],[15,49]],o:[[28,32,16,32],[45,20]],b:[26,32,15,32]},k:[["avanc","sors","sortir","reduire","angle"],["grand","large","taille","bloque","ferme"],["attend","reste","debout","patient","pas plonger"]],a:"Sortir pour réduire l’angle, se faire grand et rester debout le plus longtemps possible.",t:"Avance quand le ballon est loin du pied, arrête-toi quand il le touche. Ne plonge jamais le premier."},
{c:"Sans ballon",q:"Le ballon est sur l’aile adverse. Où te places-tu et que surveilles-tu ?",s:{m:[5,32,18,32],u:[[28,20],[28,44],[35,32]],o:[[45,10,55,14],[60,25]],b:[44,10,58,16]},k:[["avanc","haut","ligne","derriere la defense"],["profondeur","dos","balle en profondeur","passe longue"],["communique","parle","crie","defenseur","organise"]],a:"Monter derrière la défense, surveiller la profondeur et guider tes défenseurs à la voix.",t:"Ton rôle sans ballon : être le 11e joueur de champ. Plus ta ligne est haute, moins l’équipe a d’espace à défendre."},
{c:"Offensif",q:"L’adversaire presse haut et tu as le ballon. Quelle option ?",s:{m:[5,32],u:[[15,12],[15,52],[25,32,28,32]],o:[[22,30,10,32],[30,14],[30,50]],b:[7,32,15,12]},k:[["passe","relance","jou"],["libre","espace","demarqu","sans pression"],["calme","temps","controle","regard","scan","vision","tete"]],a:"Garder son calme, scanner puis jouer vers le coéquipier libre (côté) ou long vers l’avant.",t:"Regarde l’attaquant qui presse : s’il se rapproche de toi, un coéquipier est forcément libre derrière lui."}]},
D:{n:"Défenseur central (DC)",l:[
{c:"Défensif",q:"Ton partenaire central est battu et l’attaquant file. Que fais-tu ?",s:{m:[30,36,18,32],u:[[28,22,18,26],[32,50]],o:[[40,28,22,30],[45,45]],b:[38,28,20,30]},k:[["couvr","couverture","soutien","aide","compens"],["ferme","angle","axe","but"],["communic","parl","crie"]],a:"Passer en couverture, fermer l’axe du but et communiquer avec ton partenaire.",t:"Dès que ton partenaire est dépassé, tu deviens le dernier rempart : cours vers le but, pas vers le ballon."},
{c:"Contre-attaque",q:"L’adversaire contre-attaque à 3 contre 2. Que fais-tu ?",s:{m:[30,32,22,32],u:[[32,16,24,20],[32,48,24,44]],o:[[50,22,34,26],[50,34,34,34],[50,46,34,42]],b:[50,34,34,34]},k:[["recul","repli","ralenti","retard","temporis"],["pas plonger","pas tacler","patien","attend","reste"],["coequip","retour","partenaire","temps"]],a:"Reculer, temporiser sans plonger pour laisser revenir tes coéquipiers.",t:"Ton objectif n’est pas de récupérer le ballon mais de gagner du temps. Oriente le porteur vers l’extérieur."},
{c:"Sans ballon",q:"Le ballon est de l’autre côté du terrain. Où te placer ?",s:{m:[40,32,36,26],u:[[40,12],[40,50],[42,38]],o:[[60,52,60,50],[55,40],[58,24]],b:[60,52,56,50]},k:[["ligne","alignee","compact","reste"],["rentre","axe","cote ballon","coulisse","glisse"],["homme","attaquant","surveille","zone","regard"]],a:"Rester aligné avec la ligne, coulisser vers le ballon et garder un œil sur l’attaquant opposé.",t:"La ligne défensive bouge comme un accordéon : toute la ligne glisse du côté du ballon."},
{c:"Offensif",q:"Tu as le ballon, ton milieu est marqué. Quelle option ?",s:{m:[35,32,40,32],u:[[35,10],[50,32],[35,54]],o:[[52,28],[52,38],[60,20]],b:[35,32,40,32]},k:[["lateral","cote","gardien"],["conduite","avance","montee","percut"],["casse","ligne","longue","avant","attaquant"]],a:"Conduire le ballon pour attirer un adversaire, ou casser la ligne par une passe vers l’avant.",t:"Avancer avec le ballon attire un adversaire : cela libère automatiquement un coéquipier."}]},
M:{n:"Milieu central (MC)",l:[
{c:"Sans ballon",q:"Ton partenaire a le ballon. Comment te rends-tu disponible ?",s:{m:[50,32,58,22],u:[[45,48],[30,32]],o:[[56,30],[58,40],[48,22]],b:[45,48]},k:[["demarqu","espace","libre","angle","triangle"],["appel","course","mouvement","bouge","deplace"],["regard","vision","epaule","scan"]],a:"Se démarquer dans l’espace libre en créant un angle de passe, après avoir scanné.",t:"Ne reste jamais derrière un adversaire : place-toi entre deux lignes, visible pour le porteur."},
{c:"Offensif",q:"Tu reçois dos au jeu sous pression. Que faire ?",s:{m:[50,32],u:[[38,22],[60,12,66,12]],o:[[56,30,53,30],[56,36]],b:[38,22,50,32]},k:[["controle","orient","retourne","demi-tour"],["une touche","simple","protege","corps","dos"],["passe","remise","partenaire","soutien"]],a:"Protéger le ballon avec le corps, puis remise simple ou se retourner si possible.",t:"Regarde par-dessus l’épaule AVANT la passe : tu sais déjà quoi faire à la réception."},
{c:"Défensif",q:"Perte de balle, ton équipe est déséquilibrée. Réaction ?",s:{m:[55,32,40,32],u:[[45,12],[45,52]],o:[[60,32,45,32],[62,20,50,20],[62,44,50,44]],b:[60,32,45,32]},k:[["repli","recul","retour","coupe"],["pression","presse","ralenti","frein"],["passe","ligne","couvre","axe"]],a:"Replier, ralentir le porteur et couper l’axe de passe.",t:"Les 3 secondes après une perte : soit tu presses, soit tu replies. Mais jamais rien."},
{c:"Contre-attaque",q:"Tu récupères le ballon, deux coéquipiers partent. Que fais-tu ?",s:{m:[45,32,55,32],u:[[60,14,80,12],[60,50,80,50]],o:[[70,32],[72,22]],b:[45,32,60,14]},k:[["vite","rapide","direct","vertical","avant"],["passe","jou","donne"],["course","appel","espace","profondeur"]],a:"Jouer vite et vers l’avant dans la course d’un coéquipier lancé.",t:"Passe dans l’espace devant lui, pas dans ses pieds, pour qu’il garde sa vitesse."}]},
A:{n:"Avant-centre (AC)",l:[
{c:"Sans ballon",q:"Ton équipe attaque du côté opposé. Que fais-tu ?",s:{m:[70,30,82,38],u:[[50,50,70,52],[60,12]],o:[[78,26,76,30],[78,40]],b:[50,50,70,52]},k:[["demarqu","cache","dos","defenseur","epaule"],["course","appel","profondeur","bouge","entre"],["second poteau","poteau","surface","zone","ballon"]],a:"Se décaler dans le dos du défenseur et attaquer la zone du second poteau.",t:"Le défenseur ne peut pas regarder à la fois le ballon et toi : place-toi dans son angle mort."},
{c:"Offensif",q:"Tu reçois dos au but avec un défenseur dans le dos. Que fais-tu ?",s:{m:[75,32],u:[[55,22,70,20],[60,50,72,44]],o:[[80,32],[84,20]],b:[58,32,75,32]},k:[["protege","corps","bras","dos"],["remise","passe","jou","partenaire","soutien"],["retourne","tourne","demi-tour","pivot"]],a:"Protéger le ballon, puis remise vers un coéquipier qui monte ou pivot.",t:"Pose ton corps entre le ballon et le défenseur. Une remise en une touche fait monter toute l’équipe."},
{c:"Défensif",q:"Perte de balle dans le camp adverse. Quelle est ta réaction ?",s:{m:[72,32,78,28],u:[[60,16,70,18],[60,48,70,46]],o:[[84,32,70,28],[86,22,76,30]],b:[78,34,72,30]},k:[["pression","presse","reaction","contre-pressing","gegenpress"],["ferme","coupe","ligne de passe","oriente"],["ensemble","equipe","collectif","coequip","mont"]],a:"Presser immédiatement le porteur, fermer les lignes de passe, avec toute l’équipe.",t:"Presser seul ne sert à rien : presse en même temps que tes coéquipiers, sinon replie."},
{c:"Contre-attaque",q:"Ton équipe récupère le ballon, tu es devant 2 défenseurs. Que fais-tu ?",s:{m:[60,32,92,32],u:[[50,14,80,12],[50,50,80,50]],o:[[85,24,80,28],[85,40,80,38]],b:[44,32,70,32]},k:[["attend","patient","fixe","ecart"],["course","appel","profondeur","derriere","ligne"],["decale","partenaire","ailier","passe"]],a:"Lancer une course en profondeur pour étirer la défense, puis décaler un partenaire.",t:"Ta course crée l’espace pour les autres, même si tu ne touches pas le ballon."}]},
LD:{n:"Latéral droit (LD)",l:[
{c:"Offensif",q:"Ton ailier repique dans l’axe avec le ballon. Que fais-tu ?",s:{m:[45,52,70,56],u:[[55,40,62,34]],o:[[60,48,58,50],[62,30]],b:[55,40,62,34]},k:[["course","depasse","double","exterieur","appel"],["largeur","ligne","aile","ecart"],["centre","passe","debord","profondeur"]],a:"Dépasser l’ailier à l’extérieur pour offrir un débordement et de la largeur.",t:"Le latéral qui monte crée un 2 contre 1 sur l’aile : l’ailier doit voir que tu arrives."},
{c:"Défensif",q:"Un ailier adverse arrive vite sur ton côté. Comment le défends-tu ?",s:{m:[30,52,26,46],u:[[28,36,24,34],[30,20]],o:[[44,54,30,44],[48,30]],b:[44,54,30,44]},k:[["ferme","interieur","axe","oriente","exterieur"],["recul","tempor","patien","pas plonger","ralenti"],["couvr","central","aide","partenaire"]],a:"L’orienter vers l’extérieur, temporiser sans plonger et compter sur la couverture du central.",t:"Place-toi côté intérieur : oblige-le à aller vers la ligne de touche, loin du but."},
{c:"Sans ballon",q:"Ton équipe attaque de l’autre côté. Où te places-tu ?",s:{m:[50,54,58,50],u:[[60,14,66,18],[40,32]],o:[[68,50],[70,30]],b:[62,14]},k:[["large","largeur","aile","couloir"],["haut","avanc","ligne","monte"],["securite","contre","equilibr","surveille","retour"]],a:"Rester large et haut pour un renversement, tout en surveillant la contre-attaque adverse.",t:"Ta position doit permettre deux choses : recevoir un renversement ET sécuriser si on perd le ballon."},
{c:"Contre-attaque",q:"Tu récupères le ballon dans ta moitié, l’aile est libre devant toi.",s:{m:[35,52,70,56],u:[[55,30,82,26],[50,16,78,14]],o:[[60,50],[64,32]],b:[35,52,70,56]},k:[["conduite","avance","monte","court","vite","percut"],["centre","passe","avant","attaquant"],["regard","tete","vision","scan","option"]],a:"Conduire vite le ballon sur le côté libre, puis servir un attaquant lancé.",t:"Dans l’espace libre, avance : le défenseur adverse doit choisir entre toi et ton coéquipier."}]},
MDC:{n:"Milieu défensif (MDC)",l:[
{c:"Sans ballon",q:"Ton équipe attaque. Où te places-tu pour protéger ta défense ?",s:{m:[45,32,42,32],u:[[65,32,72,32],[60,14],[60,50]],o:[[55,26],[55,38],[70,24]],b:[65,32,72,32]},k:[["devant","protege","defense","filtre"],["equilibr","securite","contre","rest"],["axe","centre","ligne de passe","passe"]],a:"Rester devant la défense, dans l’axe, pour couper les passes et sécuriser la perte de balle.",t:"Le MDC est le verrou : toujours entre le ballon et ses défenseurs."},
{c:"Défensif",q:"L’adversaire a le ballon entre les lignes. Que fais-tu ?",s:{m:[42,32,48,30],u:[[35,14],[35,50],[30,32]],o:[[52,30,45,30],[58,40],[60,20]],b:[52,30,45,30]},k:[["pression","presse","ferme"],["orient","bloque","retourn","empeche"],["couvr","aide","partenaire","coequip"]],a:"Presser le porteur pour l’empêcher de se retourner, avec la couverture des défenseurs.",t:"Face au but il est dangereux, dos au but il est neutralisé : empêche-le de se retourner."},
{c:"Offensif",q:"Tu reçois entre les lignes. Quel est ton premier réflexe ?",s:{m:[48,32,50,32],u:[[35,14],[35,50],[62,22,70,22],[62,42]],o:[[56,28],[56,38]],b:[35,14,48,32]},k:[["regard","scan","vision","tete","epaule"],["une touche","simple","rapide","vite","court"],["lateral","cote","distribu","passe","jou"]],a:"Scanner avant de recevoir, puis jouer simple et vite pour changer le côté du jeu.",t:"Le MDC organise : regarde 2 ou 3 fois avant de recevoir, joue en 1 ou 2 touches."},
{c:"Contre-attaque",q:"L’adversaire contre-attaque, tu es le premier à revenir.",s:{m:[50,32,38,32],u:[[30,20],[30,44]],o:[[66,32,50,32],[68,22,52,24]],b:[66,32,50,32]},k:[["recul","repli","retour"],["tempor","ralenti","retard","patien","pas plonger"],["axe","coupe","passe","ferme"]],a:"Revenir vite, temporiser et couper l’axe sans plonger.",t:"Reculer et ralentir = ton équipe revient. Ta seule mission : gagner 3 secondes."}]},
MOC:{n:"Milieu offensif (MOC)",l:[
{c:"Sans ballon",q:"Ton équipe construit. Où te places-tu ?",s:{m:[62,32,66,38],u:[[45,32],[50,14],[50,50]],o:[[56,26],[56,38],[68,30]],b:[45,32]},k:[["entre","ligne","espace","poche"],["demarqu","libre","angle","passe"],["epaule","regard","scan","dos"]],a:"Se placer entre les lignes, dans le dos du milieu adverse, en restant disponible.",t:"Entre les lignes, tu dois pouvoir recevoir ET te retourner."},
{c:"Offensif",q:"Tu reçois face au but. Que fais-tu ?",s:{m:[70,32,76,32],u:[[78,14,86,18],[78,50,86,46],[60,32]],o:[[80,28],[80,38]],b:[60,32,70,32]},k:[["passe","decisive","dernier","avant","profondeur"],["tir","frappe","but"],["regard","tete","vision","scan","option"]],a:"Choisir vite entre la dernière passe en profondeur et le tir.",t:"Un MOC a 2 secondes : si tu hésites, il n’y a plus d’espace."},
{c:"Défensif",q:"Perte de balle, ton équipe est haute. Que fais-tu ?",s:{m:[65,32,58,32],u:[[50,32],[60,16],[60,48]],o:[[70,30,60,30],[72,40]],b:[70,30,60,30]},k:[["pression","presse","contre","immediat"],["ferme","coupe","passe","axe","oriente"],["coequip","ensemble","collectif","partenaire"]],a:"Presser tout de suite le porteur et couper l’axe, avec tes coéquipiers.",t:"Un MOC qui presse bien gagne le ballon à 30 m du but adverse."},
{c:"Contre-attaque",q:"Ton équipe récupère et part vite. Quel est ton rôle ?",s:{m:[45,32,70,32],u:[[50,14,80,12],[50,50,80,52]],o:[[75,28],[75,40]],b:[40,32,60,32]},k:[["soutien","accompagne","suit","monte","derriere"],["relais","remise","jou","passe"],["espace","course","profondeur","oppose"]],a:"Accompagner l’action, servir de relais et attaquer l’espace libre.",t:"Sois le 3e homme : arrive lancé depuis l’arrière, pas à l’arrêt."}]},
ALD:{n:"Ailier droit (ALD)",l:[
{c:"Offensif",q:"Tu as le ballon sur l’aile face à ton latéral adverse.",s:{m:[70,54,82,42],u:[[85,32],[65,32],[78,20]],o:[[78,50,76,48],[76,36]],b:[70,54,82,42]},k:[["dribble","un contre un","1v1","passe","feinte"],["centre","tir","interieur","repique","axe"],["profondeur","vitesse","aile","exterieur"]],a:"Éliminer ton adversaire (dribble ou feinte) puis centrer ou repiquer pour frapper.",t:"Change de rythme : le défenseur prépare son appui, pas ton accélération."},
{c:"Sans ballon",q:"Ton équipe attaque de l’autre côté. Que fais-tu ?",s:{m:[70,54,78,44],u:[[70,12,76,16],[55,32]],o:[[75,48],[74,28]],b:[70,12]},k:[["large","largeur","aile","etire"],["course","appel","profondeur","derriere","bouge"],["second poteau","poteau","surface","entre"]],a:"Rester large pour étirer, puis attaquer le second poteau au bon moment.",t:"Sur un renversement, tu dois être prêt à recevoir seul et à jouer ton 1 contre 1."},
{c:"Défensif",q:"Ton latéral monte et l’adversaire récupère. Que fais-tu ?",s:{m:[70,54,45,50],u:[[40,40],[55,32]],o:[[62,50,50,50],[70,40]],b:[62,50,50,50]},k:[["repli","recul","retour","couvr"],["ferme","coupe","passe","aide","soutien"],["lateral","partenaire","coequip"]],a:"Replier derrière le ballon et aider le latéral à fermer l’aile.",t:"Un ailier qui replie, c’est un latéral qui défend à 2 contre 1."},

function start(k){clearInterval(tm);const L=[...Q[k].l,...(k=="G"?PG:PF)].sort(()=>Math.random()-.5).map(q=>({...q,x:CTX[Math.random()*CTX.length|0]}));st={k,i:0,r:[],L,lv:LV};ask()}
function ask(){
 const q=st.L[st.i];dock.hidden=false;inp.value="";clearInterval(tm);
 const hint=st.lv==0?`<p class="hint">Indice : ta réponse contient ${q.k.length} idées.</p>`:"";
 app.innerHTML=`<div class="prog"><i style="width:${st.i*10}%"></i></div><div class="row"><span class="tag">${q.c}</span><span class="mu">Question ${st.i+1}/10 · ${LVS[st.lv].n}${st.lv==2?` · <b id="tm">45</b> s`:""}</span></div>${MT(q.x)}${svg(q.s)}<h2 style="margin-top:10px">${q.q}</h2>${hint}${LEG}`;
 if(st.lv==2){tl=45;tm=setInterval(()=>{tl--;const e=$("#tm");if(e)e.textContent=tl;if(tl<=0)submit(true)},1000)}
 scrollTo(0,0);inp.focus()}
function submit(auto){
 const q=st.L[st.i],v=N(inp.value.trim());if(v.length<2&&auto!==true){inp.focus();return}
 clearInterval(tm);
 const hit=q.k.map(g=>g.some(w=>v.includes(N(w)))),n=hit.filter(Boolean).length,r=n/q.k.length,f=[Math.min(1,r*1.35),r,Math.pow(r,1.5)][st.lv];

 if(++st.i<10)ask();else end()}

 app.querySelectorAll(".pos").forEach(b=>b.onclick=()=>start(b.dataset.k));
 app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{LV=+b.dataset.l;try{localStorage.setItem("vdjlv",LV)}catch(e){}app.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x==b))});
 scrollTo(0,0)}
$("#go").onclick=submit;inp.onkeydown=e=>{if(e.key=="Enter")submit()};home();
